services:
  namenode:
      image: ${HADOOP_IMAGE}
      build: ${HADOOP_GIT_URL}
      # We set labels to tell Traefik to assign a hostname to the new service
      hostname: namenode
      deploy:
        endpoint_mode: dnsrr
        resources:
          limits:
            cpus: '1'
            memory: 1024M
          reservations:
            cpus: '0.30'
            memory: 128M
        placement:
          constraints:
            - node.role == manager
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.namenode.rule=Host(`$NAMENODE_DNS`)"
            - "traefik.http.routers.namenode.entrypoints=web"
            - "traefik.http.routers.namenode.service=namenode"
            - "traefik.http.services.namenode.loadbalancer.server.port=$DFS_NAMENODE_HTTP_PORT"
            - "traefik.tcp.routers.namenode.rule=HostSNI(`*`)"
            - "traefik.tcp.routers.namenode.entrypoints=namenode"
            - "traefik.tcp.services.namenode.loadbalancer.server.port=$DFS_NAMENODE_RPC_PORT"
      environment: 
        - DFS_NAMENODE_RPC_BIND_HOST
        - YARN_RESOURCEMANAGER_HOSTNAME
        - DFS_REPLICATION
        - HADOOP_CONF_DIR
        - NAMENODE_JMX_PORT
        - HADOOP_HEAPSIZE_MIN
        - HADOOP_HEAPSIZE_MAX
      volumes: 
        - "./app/hadoop/conf/etc/hadoop:$HADOOP_CONF_DIR"
        #- "./app/hadoop/data/namenode:$DFS_NAMENODE_NAME_DIR"

  datanode:
    image: ${HADOOP_IMAGE}
    build: ${HADOOP_GIT_URL}
    hostname: "datanode{{.Task.Slot}}"
    deploy:
      mode: replicated
      replicas: 3
      endpoint_mode: dnsrr
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.30'
          memory: 128M
      placement:
        constraints:
          - node.role == worker
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.datanode.rule=Host(`datanode{{.Task.Slot}}`)"
        - "traefik.http.routers.datanode.entrypoints=web"
        - "traefik.http.routers.datanode.service=datanode"
        - "traefik.http.services.datanode.loadbalancer.server.port=$DFS_DATANODE_HTTP_PORT"
        - "traefik.tcp.routers.datanode.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.datanode.entrypoints=datanode"
        - "traefik.tcp.services.datanode.loadbalancer.server.port=$DFS_DATANODE_RPC_PORT"
        - "traefik.tcp.services.datanode.loadbalancer.passHostHeader=true"
        - "traefik.tcp.services.datanode.loadbalancer.sticky.cookie=true"
        - "traefik.tcp.services.datanode.loadbalancer.sticky.cookie.name=datanode"
    environment: 
      - DFS_NAMENODE_RPC_BIND_HOST
      - YARN_RESOURCEMANAGER_HOSTNAME
      - DFS_REPLICATION
      - HADOOP_CONF_DIR
    command: datanode
    volumes: 
      - "./app/hadoop/conf/etc/hadoop:$HADOOP_CONF_DIR"
      #- "./app/hadoop/data/datanode:$DFS_DATANODE_NAME_DIR"