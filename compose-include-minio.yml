# Settings and configurations that are common for all containers
x-minio-common: &minio-common
  image: minio/minio
  environment:
    - MINIO_ROOT_USER
    - MINIO_ROOT_PASSWORD
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 10s
    start_interval: 1s
    start_period: 10s
  labels:
    - traefik.enable=true
    - traefik.http.routers.minio.entrypoints=web
    - traefik.http.routers.minio.rule=Host(`$MINIO_DNS`)
    - traefik.http.routers.minio.service=minio
    - traefik.http.services.minio.loadbalancer.server.port=$MINIO_CONSOLE_PORT_NUMBER
  command: server --console-address ":$MINIO_CONSOLE_PORT_NUMBER" http://minio{1...4}/data{1...2}

services:
  minio1:
    <<: *minio-common
    hostname: minio1
    volumes:
      - data1-1:/data1
      - data1-2:/data2

  minio2:
    <<: *minio-common
    hostname: minio2
    volumes:
      - data2-1:/data1
      - data2-2:/data2

  minio3:
    <<: *minio-common
    hostname: minio3
    volumes:
      - data3-1:/data1
      - data3-2:/data2

  minio4:
    <<: *minio-common
    hostname: minio4
    volumes:
      - data4-1:/data1
      - data4-2:/data2

  createbuckets:
    image: minio/mc
    depends_on:
      minio1:
        condition: service_healthy
    entrypoint:
      - sh 
      - -c
      - |
        mc alias set myminio http://minio1:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD &&
        mc mb myminio/spark-bucket &&
        mc anonymous set public myminio/spark-bucket

volumes:
  data1-1:
  data1-2:
  data2-1:
  data2-2:
  data3-1:
  data3-2:
  data4-1:
  data4-2: