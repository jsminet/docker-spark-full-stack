x-low-resources: &low-resources
  resources:
    limits:
      cpus: '0.3'
      memory: 128M
    reservations:
      cpus: '0.15'
      memory: 64M

x-mid-resources: &mid-resources
  resources:
    limits:
      cpus: '0.5'
      memory: 256M
    reservations:
      cpus: '0.25'
      memory: 128M

x-high-resources: &high-resources
  resources:
    limits:
      cpus: '2'
      memory: 1024M
    reservations:
      cpus: '1'
      memory: 256M

include:
  - compose-include-minio.yml
services:
  traefik:
    image: traefik:3.0.4
    ports:
      # Exposes port 80 for incomming web requests
      - $TRAEFIK_HTTP_WEB_PORT:$TRAEFIK_HTTP_WEB_PORT
      # The Web UI port http://0.0.0.0:8080 (enabled by --api.insecure=true)
      - $TRAEFIK_HTTP_WEB_UI_PORT:$TRAEFIK_HTTP_WEB_UI_PORT
      - $POSTGRES_RPC_PORT:$POSTGRES_RPC_PORT
      - $KYUUBI_FRONTEND_BIND_PORT:$KYUUBI_FRONTEND_BIND_PORT
      - $SPARK_MASTER_PORT:$SPARK_MASTER_PORT
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./app/traefik/conf/traefik.yml:/etc/traefik/traefik.yml
    deploy:
      <<: *mid-resources
      update_config:
        delay: 10s
        order: start-first
      placement:
        constraints:
          - node.role == manager

  postgres:
    image: postgres:${POSTGRES_VERSION}
    hostname: postgres
    environment: 
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    deploy:
      endpoint_mode: dnsrr
      <<: *mid-resources
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.tcp.services.postgres.loadbalancer.server.port=$POSTGRES_RPC_PORT"
        - "traefik.tcp.routers.postgres.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.postgres.entrypoints=postgres"
    volumes:
      - "./db/postgres/dump/hive/3.1.0:/docker-entrypoint-initdb.d"

  kyuubi:
    image: $KYUUBI_IMAGE:$KYUUBI_VERSION
    build: 
      context: docker
      dockerfile: kyuubi-playground-kyuubi.Dockerfile
    hostname: kyuubi
    environment:
      - SPARK_HOME
      - KYUUBI_LOG_DIR
    deploy:
      endpoint_mode: dnsrr
      <<: *high-resources
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.tcp.routers.kyuubi.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.kyuubi.entrypoints=kyuubi"
        - "traefik.tcp.services.kyuubi.loadbalancer.server.port=$KYUUBI_FRONTEND_BIND_PORT"
        - "traefik.http.routers.kyuubi.rule=Host(`$KYUUBI_SPARKUI_DNS`)"
        - "traefik.http.routers.kyuubi.entrypoints=web"
        - "traefik.http.routers.kyuubi.service=kyuubi"
        - "traefik.http.services.kyuubi.loadbalancer.server.port=$SPARK_UI_PORT"
        - "traefik.http.routers.kyuubi1.rule=Host(`$KYUUBI_REST_DNS`)"
        - "traefik.http.routers.kyuubi1.entrypoints=web"
        - "traefik.http.routers.kyuubi1.service=kyuubi"
        - "traefik.http.services.kyuubi1.loadbalancer.server.port=$KYUUBI_FRONTEND_REST_PORT"
    volumes:
      - spark351:$SPARK_HOME
      - ./app/kyuubi/conf:$KYUUBI_HOME/conf
      - ./app/spark/conf:$SPARK_HOME/conf
      - ./jars/common/aws-java-sdk-bundle-1.12.757.jar:$KYUUBI_HOME/jars/aws-java-sdk-bundle-1.12.757.jar
      - ./jars/kyuubi/hadoop-aws-3.3.6.jar:$KYUUBI_HOME/jars/hadoop-aws-3.3.6.jar
      - ./jars/kyuubi/hadoop-cloud-storage-3.3.6.jar:$KYUUBI_HOME/jars/hadoop-cloud-storage-3.3.6.jar
      - ./db/postgres/dump/tpc/load-dataset-tpcds-tiny.sql:/opt/load_data/load-dataset-tpcds-tiny.sql
      - ./db/postgres/dump/tpc/load-dataset-tpch-tiny.sql:/opt/load_data/load-dataset-tpch-tiny.sql

  metastore:
    image: nekyuubi/kyuubi-playground-metastore:${KYUUBI_VERSION}
    build: 
      context: docker
      dockerfile: kyuubi-playground-metastore.Dockerfile
    hostname: metastore
    deploy:
      endpoint_mode: dnsrr
      <<: *mid-resources
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.tcp.routers.metastore.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.metastore.entrypoints=metastore"
        - "traefik.tcp.services.metastore.loadbalancer.server.port=$METASTORE_RPC_PORT"
    volumes:
      - ./app/kyuubi/conf/core-site.xml:/etc/hadoop/conf/core-site.xml
      - ./app/kyuubi/conf/hive-site.xml:/etc/hive/conf/hive-site.xml

  sparkmaster:
    image: $SPARK_IMAGE:$SPARK_VERSION
    build: $KYUUBI_GIT_URL
    hostname: sparkmaster
    environment:
      - SPARK_MASTER_PORT
      - SPARK_MASTER_WEBUI_PORT
      - SPARK_DRIVER_MEMORY
    deploy:
      endpoint_mode: dnsrr
      <<: *mid-resources
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.tcp.routers.sparkmaster.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.sparkmaster.entrypoints=spark"
        - "traefik.tcp.services.sparkmaster.loadbalancer.server.port=$SPARK_MASTER_PORT"
        - "traefik.http.routers.sparkmaster.rule=Host(`$SPARK_MASTER_DNS`)"
        - "traefik.http.routers.sparkmaster.entrypoints=web"
        - "traefik.http.routers.sparkmaster.service=sparkmaster"
        - "traefik.http.services.sparkmaster.loadbalancer.server.port=$SPARK_MASTER_WEBUI_PORT"
    volumes:
      - spark351:$SPARK_HOME
      - ./app/spark/conf:$SPARK_HOME/conf
      - ./jars/common/aws-java-sdk-bundle-1.12.757.jar:/opt/spark-3.5.1-bin-hadoop3/jars/aws-java-sdk-bundle-1.12.757.jar
      - ./jars/spark/postgresql-42.7.3.jar:/opt/spark-3.5.1-bin-hadoop3/jars/postgresql-42.7.3.jar
      - ./jars/spark/hadoop-aws-3.3.4.jar:/opt/spark-3.5.1-bin-hadoop3/jars/hadoop-aws-3.3.4.jar
      - ./jars/spark/hadoop-cloud-storage-3.3.4.jar:/opt/spark-3.5.1-bin-hadoop3/jars/hadoop-cloud-storage-3.3.4.jar
      - ./jars/spark/iceberg-spark-runtime-3.5_2.12-1.5.2.jar:/opt/spark-3.5.1-bin-hadoop3/jars/iceberg-spark-runtime-3.5_2.12-1.5.2.jar
      - ./jars/spark/kyuubi-spark-connector-tpcds_2.12-1.9.1.jar:/opt/spark-3.5.1-bin-hadoop3/jars/kyuubi-spark-connector-tpcds_2.12-1.9.1.jar
      - ./jars/spark/kyuubi-spark-connector-tpch_2.12-1.9.1.jar:/opt/spark-3.5.1-bin-hadoop3/jars/kyuubi-spark-connector-tpch_2.12-1.9.1.jar
      - ./jars/spark/spark-hadoop-cloud_2.12-3.5.1.jar:/opt/spark-3.5.1-bin-hadoop3/jars/spark-hadoop-cloud_2.12-3.5.1.jar

  sparkworker:
    image: $SPARK_IMAGE:$SPARK_VERSION
    build: $KYUUBI_GIT_URL
    hostname: "sparkworker{{.Task.Slot}}"
    environment:
      - SPARK_WORKER_CORES
      - SPARK_WORKER_MEMORY
    deploy:
      mode: replicated
      replicas: 3
      endpoint_mode: dnsrr
      <<: *high-resources
      placement:
        constraints:
          - node.role == worker
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.sparkworker.rule=Host(`$SPARK_WORKER_DNS`)"
        - "traefik.http.routers.sparkworker.entrypoints=web"
        - "traefik.http.routers.sparkworker.service=sparkworker"
        - "traefik.http.services.sparkworker.loadbalancer.server.port=$SPARK_WORKER_WEBUI_PORT"
    command: worker spark://sparkmaster:$SPARK_MASTER_PORT
    volumes:
      - spark351:$SPARK_HOME
      - ./app/spark/conf:$SPARK_HOME/conf
      - ./app/spark/conf:/opt/spark-3.5.1-bin-hadoop3/conf
      - ./jars/common/aws-java-sdk-bundle-1.12.757.jar:/opt/spark-3.5.1-bin-hadoop3/jars/aws-java-sdk-bundle-1.12.757.jar
      - ./jars/spark/postgresql-42.7.3.jar:/opt/spark-3.5.1-bin-hadoop3/jars/postgresql-42.7.3.jar
      - ./jars/spark/hadoop-aws-3.3.4.jar:/opt/spark-3.5.1-bin-hadoop3/jars/hadoop-aws-3.3.4.jar
      - ./jars/spark/hadoop-cloud-storage-3.3.4.jar:/opt/spark-3.5.1-bin-hadoop3/jars/hadoop-cloud-storage-3.3.4.jar
      - ./jars/spark/iceberg-spark-runtime-3.5_2.12-1.5.2.jar:/opt/spark-3.5.1-bin-hadoop3/jars/iceberg-spark-runtime-3.5_2.12-1.5.2.jar
      - ./jars/spark/kyuubi-spark-connector-tpcds_2.12-1.9.1.jar:/opt/spark-3.5.1-bin-hadoop3/jars/kyuubi-spark-connector-tpcds_2.12-1.9.1.jar
      - ./jars/spark/kyuubi-spark-connector-tpch_2.12-1.9.1.jar:/opt/spark-3.5.1-bin-hadoop3/jars/kyuubi-spark-connector-tpch_2.12-1.9.1.jar
      - ./jars/spark/spark-hadoop-cloud_2.12-3.5.1.jar:/opt/spark-3.5.1-bin-hadoop3/jars/spark-hadoop-cloud_2.12-3.5.1.jar

  zookeeper:
    image: zookeeper:latest
    hostname: zookeeper
    deploy:
      endpoint_mode: dnsrr
      <<: *low-resources
      placement:
        constraints:
          - node.role == manager
    volumes: 
      - "./app/zookeeper/conf:$ZOOKEEPER_CONF_DIR"

  zeppelin:
    image: $ZEPPELIN_IMAGE:$ZEPPELIN_VERSION
    hostname: zeppelin
    build: ${ZEPPELIN_GIT_URL}
    environment:
      - SPARK_MASTER=spark://$SPARK_MASTER_HOST:$SPARK_MASTER_PORT
      - SPARK_HOME
      - ZEPPELIN_CONF_DIR
      - ZEPPELIN_LOG_DIR
      - ZEPPELIN_NOTEBOOK_DIR
    deploy:
      endpoint_mode: dnsrr
      <<: *mid-resources
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.zeppelin.rule=Host(`$ZEPPELIN_DNS`)"
        - "traefik.http.routers.zeppelin.entrypoints=web"
        - "traefik.http.routers.zeppelin.service=zeppelin"
        - "traefik.http.services.zeppelin.loadbalancer.server.port=$ZEPPELIN_HTTP_PORT"
        - "traefik.http.routers.zeppelin2.rule=Host(`$ZEPPELIN_SPARKUI_DNS`)"
        - "traefik.http.routers.zeppelin2.entrypoints=web"
        - "traefik.http.routers.zeppelin2.service=zeppelin2"
        - "traefik.http.services.zeppelin2.loadbalancer.server.port=$SPARK_UI_PORT"
    volumes:
      - spark351:$SPARK_HOME
      - "./app/zeppelin:/app/zeppelin"
      - "./app/kyuubi:/app/kyuubi"

  swarmpit:
    image: swarmpit/swarmpit:latest
    hostname: swarmpit
    environment:
      - SWARMPIT_DB=http://$COUCHDB_USER:$COUCHDB_PASSWORD@couchdb:5984
      - SWARMPIT_INFLUXDB=http://influxdb:8086
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      endpoint_mode: dnsrr
      <<: *mid-resources
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.swarmpit.rule=Host(`$SWARMPIT_DNS`)"
        - "traefik.http.routers.swarmpit.entrypoints=web"
        - "traefik.http.routers.swarmpit.service=swarmpit"
        - "traefik.http.services.swarmpit.loadbalancer.server.port=$SWARMPIT_HTTP_PORT"

  couchdb:
    image: couchdb:3.3.3
    hostname: couchdb
    environment:   
        - COUCHDB_USER
        - COUCHDB_PASSWORD
    volumes:
      - couchdb-data:/opt/couchdb/data
    deploy:
      endpoint_mode: dnsrr
      <<: *low-resources
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.couchdb.rule=Host(`$COUCHDB_DNS`)"
        - "traefik.http.routers.couchdb.entrypoints=web"
        - "traefik.http.routers.couchdb.service=couchdb"
        - "traefik.http.services.couchdb.loadbalancer.server.port=$COUCHDB_HTTP_PORT"

  influxdb:
    image: influxdb:1.8.10
    hostname: influxdb
    volumes:
      - influx-data:/var/lib/influxdb
    deploy:
      endpoint_mode: dnsrr
      <<: *mid-resources
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.influxdb.rule=Host(`$INFLUXDB_DNS`)"
        - "traefik.http.routers.influxdb.entrypoints=web"
        - "traefik.http.routers.influxdb.service=influxdb"
        - "traefik.http.services.influxdb.loadbalancer.server.port=$INFLUXDB_HTTP_PORT"

  agent:
    image: swarmpit/agent:latest
    hostname: agent
    environment:
      - DOCKER_API_VERSION=1.35
      - EVENT_ENDPOINT=http://swarmpit:8080/events
      - HEALTH_CHECK_ENDPOINT=http://swarmpit:8080/version
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      endpoint_mode: dnsrr
      mode: global
      labels:
        swarmpit.agent: 'true'
      <<: *low-resources

volumes: 
  spark351:
  couchdb-data:
  influx-data: