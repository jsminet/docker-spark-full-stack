x-low-resources: &low-resources
  resources:
    limits:
      cpus: '0.3'
      memory: 128M
    reservations:
      cpus: '0.15'
      memory: 64M

x-mid-resources: &mid-resources
  resources:
    limits:
      cpus: '0.8'
      memory: 512M
    reservations:
      cpus: '0.25'
      memory: 128M

x-high-resources: &high-resources
  resources:
    limits:
      cpus: '2'
      memory: 1024M
    reservations:
      cpus: '1'
      memory: 256M

x-very-high-resources: &very-high-resources
  resources:
    limits:
      cpus: '3'
      memory: 6G
    reservations:
      cpus: '1'
      memory: 1G

include:
  - include/compose-include-minio.yml
  - include/compose-include-metrics.yml
  - include/compose-include-swarmpit.yml
  - include/compose-include-superset.yml
services:
  traefik:
    image: traefik:3.2.1
    ports:
      # Exposes port 80 for incomming web requests
      - $TRAEFIK_HTTP_WEB_PORT:$TRAEFIK_HTTP_WEB_PORT
      # The Web UI port http://0.0.0.0:8080 (enabled by --api.insecure=true)
      - $TRAEFIK_HTTP_WEB_UI_PORT:$TRAEFIK_HTTP_WEB_UI_PORT
      - $POSTGRES_RPC_PORT:$POSTGRES_RPC_PORT
      - $KYUUBI_FRONTEND_BIND_PORT:$KYUUBI_FRONTEND_BIND_PORT
      - $SPARK_MASTER_PORT:$SPARK_MASTER_PORT
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./app/traefik/conf/traefik.yml:/etc/traefik/traefik.yml
    deploy:
      <<: *low-resources
      update_config:
        delay: 10s
        order: start-first
      placement:
        constraints:
          - node.role == manager

  postgres:
    image: postgres:${POSTGRES_VERSION}
    hostname: postgres
    environment: 
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    deploy:
      endpoint_mode: dnsrr
      <<: *low-resources
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.tcp.services.postgres.loadbalancer.server.port=$POSTGRES_RPC_PORT"
        - "traefik.tcp.routers.postgres.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.postgres.entrypoints=postgres"
    volumes:
      - "./db/postgres/dump/hive/3.1.0:/docker-entrypoint-initdb.d"
      - "postgres-data:/var/lib/postgresql/data"

  kyuubi:
    image: $KYUUBI_IMAGE:$KYUUBI_VERSION
    hostname: kyuubi
    environment:
      - SPARK_HOME
      - SPARK_CONF_DIR
      - SPARK_LOG_DIR
      - SPARK_WORKER_DIR
      - KYUUBI_LOG_DIR
      - KYUUBI_CONF_DIR
      - KYUUBI_PID_DIR
      - KYUUBI_WORK_DIR_ROOT
# NO EXTRA JARS in Apache Kyuubi jars directory !!!!
      - KYUUBI_JAR_DIR
    deploy:
      endpoint_mode: dnsrr
      <<: *high-resources
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.tcp.routers.kyuubi.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.kyuubi.entrypoints=kyuubi"
        - "traefik.tcp.services.kyuubi.loadbalancer.server.port=$KYUUBI_FRONTEND_BIND_PORT"
        - "traefik.http.routers.kyuubi.rule=Host(`$KYUUBI_SPARKUI_DNS`)"
        - "traefik.http.routers.kyuubi.entrypoints=web"
        - "traefik.http.routers.kyuubi.service=kyuubi"
        - "traefik.http.services.kyuubi.loadbalancer.server.port=$SPARK_UI_PORT"
        - "traefik.http.routers.kyuubi1.rule=Host(`$KYUUBI_REST_DNS`)"
        - "traefik.http.routers.kyuubi1.entrypoints=web"
        - "traefik.http.routers.kyuubi1.service=kyuubi1"
        - "traefik.http.services.kyuubi1.loadbalancer.server.port=$KYUUBI_FRONTEND_REST_PORT"
    volumes:
      - spark352:$SPARK_HOME
      - ./app/kyuubi:/app/kyuubi
      - ./app/spark:/app/spark
      - ./db/postgres/dump/tpc:/opt/load_data

  metastore:
    image: nekyuubi/kyuubi-playground-metastore:${KYUUBI_VERSION}
    build: 
      context: docker
      dockerfile: kyuubi-playground-metastore.Dockerfile
    hostname: metastore
    deploy:
      endpoint_mode: dnsrr
      <<: *low-resources
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.tcp.routers.metastore.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.metastore.entrypoints=metastore"
        - "traefik.tcp.services.metastore.loadbalancer.server.port=$METASTORE_RPC_PORT"
    volumes:
      - ./app/kyuubi/conf/core-site.xml:/etc/hadoop/conf/core-site.xml
      - ./app/kyuubi/conf/hive-site.xml:/etc/hive/conf/hive-site.xml

  sparkmaster:
    image: $SPARK_IMAGE:$SPARK_VERSION
    hostname: sparkmaster
    environment:
      - SPARK_MASTER_PORT
      - SPARK_MASTER_WEBUI_PORT
      - SPARK_DRIVER_MEMORY
      - SPARK_HOME
      - SPARK_CONF_DIR
      - SPARK_LOG_DIR
      - SPARK_WORKER_DIR
    deploy:
      endpoint_mode: dnsrr
      <<: *mid-resources
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.tcp.routers.sparkmaster.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.sparkmaster.entrypoints=spark"
        - "traefik.tcp.services.sparkmaster.loadbalancer.server.port=$SPARK_MASTER_PORT"
        - "traefik.http.routers.sparkmaster.rule=Host(`$SPARK_MASTER_DNS`)"
        - "traefik.http.routers.sparkmaster.entrypoints=web"
        - "traefik.http.routers.sparkmaster.service=sparkmaster"
        - "traefik.http.services.sparkmaster.loadbalancer.server.port=$SPARK_MASTER_WEBUI_PORT"
    volumes:
      - spark352:$SPARK_HOME
      - ./app/spark:/app/spark

  sparkworker:
    image: $SPARK_IMAGE:$SPARK_VERSION
    hostname: "sparkworker{{.Task.Slot}}"
    environment:
      - SPARK_WORKER_CORES
      - SPARK_WORKER_MEMORY
      - SPARK_HOME
      - SPARK_CONF_DIR
      - SPARK_LOG_DIR
      - SPARK_WORKER_DIR
    deploy:
      mode: replicated
      replicas: 3
      endpoint_mode: dnsrr
      <<: *very-high-resources
      placement:
        constraints:
          - node.role == worker
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.sparkworker.rule=Host(`$SPARK_WORKER_DNS`)"
        - "traefik.http.routers.sparkworker.entrypoints=web"
        - "traefik.http.routers.sparkworker.service=sparkworker"
        - "traefik.http.services.sparkworker.loadbalancer.server.port=$SPARK_WORKER_WEBUI_PORT"
    command: worker spark://sparkmaster:$SPARK_MASTER_PORT
    volumes:
      - spark352:$SPARK_HOME
      - ./app/spark:/app/spark

  zookeeper:
    image: zookeeper:latest
    hostname: zookeeper
    deploy:
      endpoint_mode: dnsrr
      <<: *low-resources
      placement:
        constraints:
          - node.role == manager
    volumes: 
      - ./app/zookeeper/conf:$ZOOKEEPER_CONF_DIR

  zeppelin:
    image: $ZEPPELIN_IMAGE:$ZEPPELIN_VERSION
    hostname: zeppelin
    build: ${ZEPPELIN_GIT_URL}
    environment:
      - SPARK_MASTER=spark://$SPARK_MASTER_HOST:$SPARK_MASTER_PORT
      - SPARK_HOME
      - SPARK_CONF_DIR
      - SPARK_APP_NAME=ZeppelinOnDocker
      - USE_HADOOP
      - ZEPPELIN_ADDR
      - ZEPPELIN_CONF_DIR
      - ZEPPELIN_LOG_DIR
      - ZEPPELIN_NOTEBOOK_DIR
    deploy:
      endpoint_mode: dnsrr
      <<: *low-resources
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.zeppelin.rule=Host(`$ZEPPELIN_DNS`)"
        - "traefik.http.routers.zeppelin.entrypoints=web"
        - "traefik.http.routers.zeppelin.service=zeppelin"
        - "traefik.http.services.zeppelin.loadbalancer.server.port=$ZEPPELIN_HTTP_PORT"
        - "traefik.http.routers.zeppelin2.rule=Host(`$ZEPPELIN_SPARKUI_DNS`)"
        - "traefik.http.routers.zeppelin2.entrypoints=web"
        - "traefik.http.routers.zeppelin2.service=zeppelin2"
        - "traefik.http.services.zeppelin2.loadbalancer.server.port=$SPARK_UI_PORT"
    volumes:
      - spark352:$SPARK_HOME
      - ./app/spark:/app/spark
      - ./app/zeppelin:/app/zeppelin

volumes: 
  spark352:
  couchdb-data:
  influx-data:
  postgres-data: