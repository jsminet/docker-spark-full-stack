services:
  kyuubi:
    image: $KYUUBI_IMAGE:$KYUUBI_VERSION
    hostname: kyuubi
    environment:
      - SPARK_HOME
      - SPARK_CONF_DIR
      - SPARK_LOG_DIR
      - KYUUBI_LOG_DIR
      - KYUUBI_CONF_DIR
      - KYUUBI_PID_DIR
      - KYUUBI_WORK_DIR_ROOT
      - KYUUBI_JAR_DIR
    volumes:
      - spark351:$SPARK_HOME
      - ../app/kyuubi:/app/kyuubi
      - ../app/spark:/app/spark
      - ../app/hadoop:/app/hadoop
      - ../db/postgres/dump/tpc:/opt/load_data
      - ../app/kyuubi/jars:/usr/java/packages/lib

  sparkmaster:
    image: $SPARK_IMAGE:$SPARK_VERSION
    hostname: sparkmaster
    environment:
      - SPARK_MASTER_PORT
      - SPARK_MASTER_WEBUI_PORT
      - SPARK_DRIVER_MEMORY
      - SPARK_HOME
      - SPARK_CONF_DIR
      - SPARK_LOG_DIR
    volumes:
      - spark351:$SPARK_HOME
      - ../app/spark:/app/spark


  sparkworker:
    image: $SPARK_IMAGE:$SPARK_VERSION
    hostname: "sparkworker{{.Task.Slot}}"
    environment:
      - SPARK_WORKER_CORES
      - SPARK_WORKER_MEMORY
      - SPARK_HOME
      - SPARK_CONF_DIR
      - SPARK_LOG_DIR
    deploy:
      mode: replicated
      replicas: 1
    command: worker spark://sparkmaster:$SPARK_MASTER_PORT
    volumes:
      - spark351:$SPARK_HOME
      - ../app/spark:/app/spark

  zookeeper:
    image: zookeeper:latest
    hostname: zookeeper
    volumes: 
      - ../app/zookeeper/conf:$ZOOKEEPER_CONF_DIR

  zeppelin:
    image: apache/zeppelin:$ZEPPELIN_VERSION
    hostname: zeppelin
    ports:
      - 8080:8080
    environment:
      - SPARK_MASTER=spark://$SPARK_MASTER_HOST:$SPARK_MASTER_PORT
      - SPARK_HOME
      - ZEPPELIN_CONF_DIR
      - ZEPPELIN_LOG_DIR
      - ZEPPELIN_NOTEBOOK_DIR
    volumes:
      - spark351:$SPARK_HOME
      - ./app/spark:/app/spark
      - ./app/zeppelin:/app/zeppelin

volumes: 
  spark351: