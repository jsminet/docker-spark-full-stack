services:
  kyuubi:
    image: $KYUUBI_IMAGE:$KYUUBI_VERSION
    hostname: kyuubi
    environment:
      - SPARK_HOME
      - KYUUBI_LOG_DIR
    ports:
      - 10009:10009
      - 10099:10099
    volumes:
      - spark351:$SPARK_HOME
      - #../app/kyuubi/conf:/app/kyuubi/conf
      - #../app/spark/conf:/app/spark/conf
      - ../app/kyuubi/jars:/app/kyuubi/jars
      - ../db/postgres/dump/tpc:/opt/load_data

  sparkmaster:
    image: $SPARK_IMAGE:$SPARK_VERSION
    hostname: sparkmaster
    environment:
      - SPARK_MASTER_PORT
      - SPARK_MASTER_WEBUI_PORT
      - SPARK_DRIVER_MEMORY
    ports:
      - $SPARK_MASTER_WEBUI_PORT:$SPARK_MASTER_WEBUI_PORT
      - $SPARK_MASTER_PORT:$SPARK_MASTER_PORT
    volumes:
      - spark351:$SPARK_HOME
      - ../app/spark/conf:/app/spark/conf
      - ../app/spark/jars:/app/spark/jars


  sparkworker:
    image: $SPARK_IMAGE:$SPARK_VERSION
    hostname: "sparkworker{{.Task.Slot}}"
    environment:
      - SPARK_WORKER_CORES
      - SPARK_WORKER_MEMORY
    deploy:
      mode: replicated
      replicas: 1
    ports:
      - 4040:4040
      - 8081:8081
    command: worker spark://sparkmaster:$SPARK_MASTER_PORT
    volumes:
      - spark351:$SPARK_HOME
      - ../app/spark/conf:/app/spark/conf
      - ../app/spark/jars:/app/spark/jars

  zookeeper:
    image: zookeeper:latest
    hostname: zookeeper
    volumes: 
      - "../app/zookeeper/conf:$ZOOKEEPER_CONF_DIR"

volumes: 
  spark351: